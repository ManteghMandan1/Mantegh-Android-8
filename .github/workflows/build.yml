name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Get toolchain
        run: |
          git clone --depth=1 \
            https://github.com/SaberMod/android_prebuilts_gcc_linux-x86_arm_sabermod-arm-eabi-4.8 \
            toolchain || \
          git clone --depth=1 \
            https://github.com/khadas/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.8 \
            toolchain

          TOOLCHAIN_BIN=$(dirname "$(find toolchain -type f -name arm-eabi-gcc | head -1)")

          if [ -z "$TOOLCHAIN_BIN" ]; then
            echo "ERROR: arm-eabi-gcc not found!"
            exit 1
          fi

          echo "Toolchain: $TOOLCHAIN_BIN"
          "$TOOLCHAIN_BIN/arm-eabi-gcc" --version

          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"

      - name: Get AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel

      - name: Build kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE="$TOOLCHAIN_BIN/arm-eabi-"

          make lineage_k3gxx_defconfig

          echo "========================================"
          echo "       FINAL WIFI KERNEL CONFIG"
          echo "========================================"
          grep -E 'CONFIG_(WLAN|BCMDHD|BCM|CFG80211|DHD)' .config || true

          echo "=== CONFIG_BCM4354 in final .config ==="
          grep "CONFIG_BCM4354" .config || echo "NOT SET"

          make -j"$(nproc)" HOSTCFLAGS="-fcommon"

          test -f arch/arm/boot/zImage

          echo "Kernel built successfully:"
          ls -lh arch/arm/boot/zImage

          echo "=== Was bcmdhd actually compiled? ==="
          find . -path "*/bcmdhd/*.o" | head -20
          echo "=== count of .o files in bcmdhd dir ==="
          find . -path "*/bcmdhd/*.o" | wc -l

      - name: Package with AnyKernel3
        run: |
          cp arch/arm/boot/zImage anykernel/zImage

          cd anykernel

          sed -i 's/^kernel.string=.*/kernel.string=Mantegh Kernel/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/mmcblk0p9;|' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0/' anykernel.sh

          echo "AnyKernel configuration:"
          grep -E '^(kernel.string|do.devicecheck|BLOCK|IS_SLOT_DEVICE)' anykernel.sh

          zip -r9 ../Mantegh-Kernel.zip . \
            -x ".git/*" \
            -x "README.md"

      - name: Check ZIP
        run: |
          test -f Mantegh-Kernel.zip
          unzip -l Mantegh-Kernel.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mantegh-Kernel
          path: Mantegh-Kernel.zip
